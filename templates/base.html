<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FightIQ
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<header class="navbar">

    <a
        href="/"
        class="logo"
    >
        Fight<span>IQ</span>
    </a>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="/fighters">
            Fighters
        </a>

        <a href="/compare">
            Compare
        </a>

        <a href="/analytics">
            Analytics
        </a>

        <a href="{{ url_for('betting') }}">Betting</a>

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <strong>
        FightIQ
    </strong>

    <p>
        MMA analytics powered by Python,
        SQL and real fighter data.
    </p>

</footer>


</body>

</html>
